@@MODULES
// ---------------------------------------------------------------------------
// OpenMaver V2.0 默认配置（JSONC：支持 // 行注释与 /* */ 块注释）
//
// 所有功能模块默认 enabled: false，仅日志工具默认开启。
// 嵌套 key 通过点号访问，例如：combat.aimassist.enabled
//
// 模块配置路径约定（见 module.Module）：
//   包名去掉根包 "module" + "." + 类名小写
//   例如 module.movement.AutoSprint -> movement.autosprint
// ---------------------------------------------------------------------------
{
  // 移动相关模块
  "movement": {
    "attackreduce": {"enabled": true, "key": ""},
    "autosprint": {
      "enabled": false,        // 示例模块 AutoSprint：默认关闭（链路验证时可临时改为 true）
      "key": "V"               // 绑定键位（HUD 右侧显示，按 V 切换）
    },
    "scaffold": {
      "enabled": false,        // Scaffold 自动搭路：默认关闭（按 G 切换）
      "key": "G"               // 绑定键位（按 G 切换）
    },
    "godbridge": {
      "enabled": false,        // GodBridge 神桥：默认关闭（按 B 切换）
      "key": "B"               // 绑定键位（按 B 切换）
    }
  },

  // 战斗相关模块
  "combat": {
    "aimassist": {
      "enabled": false,        // 瞄准辅助：默认关闭
      "key": "C",              // 绑定键位
      "speed": 0.15,           // 平滑速度（0.0 ~ 1.0）
      "maxDistance": 6.0       // 最大作用距离（单位：方块）
    },
    "autoclicker": {
      "enabled": false,        // 自动点击器：默认关闭
      "key": "R"               // 绑定键位（按 R 切换；左键 8~12 CPS）
    }
  },

  // 玩家相关模块
  "player": {
    "fastplace": {
      "enabled": false,        // 快速右键：默认关闭
      "key": "F"               // 绑定键位（按 F 切换）
    }
  },

  // 渲染相关模块
  "render": {
    "esp": {
      "enabled": false,        // 透视标记：默认关闭
      "key": "X",              // 绑定键位
      "color": "#FFFFFF",      // 颜色（十六进制 RGB）
      "thickness": 1.5,        // 线宽
      "maxDistance": 64        // 最大渲染距离（单位：方块）
    },
    "targethud": {
      "enabled": true,        // 目标信息面板：默认关闭（按 H 切换）
      "key": "H"               // 绑定键位
    },
    "fullbright": {
      "enabled": false,        // 全亮/夜视：默认关闭（按 Y 切换）
      "key": "Y"               // 绑定键位
    }
  },

  // 工具类模块
  "tools": {
    "logger": {
      "enabled": true,         // 日志系统默认开启
      "path": "./logs/openmaver.log"
    }
  }
}
@@STATE
Velocity|on|
