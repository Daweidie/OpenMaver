<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OpenMaver — ClickGUI Design</title>
<style>
  /* ============================================================
     OpenMaver ClickGUI — high-fidelity design prototype
     Reference: Vape / Zenith · dark frosted glass · neon cyan
     Artboard: 1600 × 1000 (append ?scale=2 for a 2x render)
     ============================================================ */

  :root{
    --bg:#04060a;
    --panel:rgba(9,13,20,.74);
    --line:rgba(255,255,255,.055);
    --line-2:rgba(255,255,255,.09);
    --text:#EEF3FB;
    --text-2:#A5AFBF;
    --muted:#6B7586;
    --faint:#4E5765;
    --cyan:#5CE1FF;
    --cyan-soft:rgba(92,225,255,.12);
    --green:#5BF0B0;
    --amber:#FFC46B;
    --violet:#B18CFF;
    --sans:"Noto Sans","Adwaita Sans",system-ui,sans-serif;
    --mono:"JetBrains Mono","Noto Sans Mono",monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1600px;height:1000px;overflow:hidden;background:var(--bg)}
  body{
    font-family:var(--sans);
    color:var(--text);
    font-size:13px;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    user-select:none;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  svg{display:block}
  .mono{font-family:var(--mono);font-variant-ligatures:none}

  /* ---------------------------- backdrop ---------------------------- */
  .stage{position:relative;width:1600px;height:1000px;overflow:hidden}
  .bg{position:absolute;inset:0;background:#04060a}

  .bg::before{
    content:"";position:absolute;inset:-12%;
    background:
      radial-gradient(42% 46% at 16% 26%, rgba(22,128,168,.50), transparent 72%),
      radial-gradient(38% 42% at 84% 16%, rgba(96,62,176,.34), transparent 72%),
      radial-gradient(55% 48% at 52% 96%, rgba(16,96,118,.42), transparent 74%),
      radial-gradient(30% 30% at 74% 64%, rgba(168,74,96,.16), transparent 72%);
    filter:blur(46px);
  }

  /* soft pixel-ish blocks — memory of a blurred world, not literal */
  .blocks i{
    position:absolute;display:block;border-radius:10px;
    filter:blur(34px);opacity:.55;
    background:linear-gradient(150deg, rgba(70,170,210,.30), rgba(14,40,64,.05));
  }
  .blocks i:nth-child(1){left:3%;top:58%;width:240px;height:240px}
  .blocks i:nth-child(2){left:19%;top:70%;width:180px;height:180px;opacity:.4}
  .blocks i:nth-child(3){left:76%;top:24%;width:260px;height:260px;
    background:linear-gradient(150deg, rgba(130,90,220,.26), rgba(20,20,50,.04));opacity:.5}
  .blocks i:nth-child(4){left:66%;top:62%;width:200px;height:200px;
    background:linear-gradient(150deg, rgba(180,90,120,.16), rgba(30,10,30,.02));opacity:.45}

  .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(120,200,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,200,255,.055) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(58% 62% at 50% 46%, #000 12%, transparent 82%);
    mask-image:radial-gradient(58% 62% at 50% 46%, #000 12%, transparent 82%);
    opacity:.65;
  }

  .vignette{
    position:absolute;inset:0;
    background:radial-gradient(74% 72% at 50% 46%, transparent 38%, rgba(0,0,0,.62) 100%);
  }

  .noise{
    position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
  }

  /* ---------------------------- panel ---------------------------- */
  .panel{
    position:absolute;left:100px;top:70px;
    width:1400px;height:860px;
    display:flex;
    border-radius:18px;
    background:linear-gradient(158deg, rgba(17,23,33,.80), rgba(7,10,16,.88));
    -webkit-backdrop-filter:blur(30px) saturate(135%);
    backdrop-filter:blur(30px) saturate(135%);
    border:1px solid rgba(116,231,255,.28);
    box-shadow:
      0 0 0 1px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.06),
      inset 0 0 90px rgba(30,120,160,.055),
      0 44px 110px rgba(0,0,0,.72),
      0 0 90px rgba(48,190,235,.10);
    overflow:hidden;
  }
  .panel::before{
    content:"";position:absolute;left:0;right:0;top:0;height:1px;z-index:5;
    background:linear-gradient(90deg, transparent 6%, rgba(150,245,255,.55) 38%, rgba(150,245,255,.55) 62%, transparent 94%);
  }

  /* ---------------------------- rail ---------------------------- */
  .rail{
    width:258px;flex:0 0 258px;
    padding:18px 16px 16px;
    display:flex;flex-direction:column;
    border-right:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,.022), rgba(255,255,255,.006) 42%, transparent);
  }

  .brand{display:flex;align-items:center;gap:11px;padding:3px 4px 0}
  .logo{
    width:36px;height:36px;border-radius:10px;flex:0 0 36px;
    background:linear-gradient(150deg,#8DF3FF 0%,#48C8F0 46%,#2D7BE8 100%);
    display:grid;place-items:center;
    box-shadow:0 0 22px rgba(80,215,255,.35), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .brand-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .brand-name{font-size:12px;font-weight:700;letter-spacing:.17em;line-height:1}
  .brand-sub{font-size:8px;letter-spacing:.24em;color:var(--muted);line-height:1;font-weight:600}
  .ver{
    margin-left:auto;align-self:flex-start;
    font-family:var(--mono);font-size:8.5px;color:#94A0B3;
    padding:3px 5px;border-radius:4px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
  }

  .rail-label{
    margin:26px 10px 9px;
    font-size:8.5px;font-weight:600;letter-spacing:.22em;color:var(--faint);
    display:flex;align-items:center;justify-content:space-between;
  }
  .rail-label.sub{margin-top:20px}
  .rail-label span:last-child{
    font-family:var(--mono);letter-spacing:0;color:#4B5462;font-size:8px;
  }

  .nav{display:flex;flex-direction:column;gap:3px}
  .nav.sub .nav-item{height:36px;color:#818C9D}
  .nav.sub .nav-item .lbl{font-size:12px}
  .nav.sub .nav-item .ic{color:#6B7686}
  .nav-item{
    position:relative;height:38px;width:100%;
    display:flex;align-items:center;gap:11px;
    padding:0 10px;border-radius:8px;
    color:var(--text-2);
    transition:background .16s ease,color .16s ease;
  }
  .nav-item .ic{color:#7D879A;transition:color .16s ease;flex:0 0 16px}
  .nav-item .lbl{font-size:12.5px;font-weight:500;letter-spacing:.005em}
  .nav-item .cnt{
    margin-left:auto;font-family:var(--mono);font-size:9px;color:#596272;
    transition:color .16s ease;
  }
  .nav-item:hover{background:rgba(255,255,255,.035);color:#E4EBF6}
  .nav-item:hover .ic{color:#B6C2D4}
  .nav-item.active{
    color:#F2FAFF;
    margin-left:-16px;
    width:calc(100% + 16px);
    padding-left:26px;
    border-radius:0 8px 8px 0;
    background:linear-gradient(90deg,
      color-mix(in srgb, var(--acc) 17%, transparent),
      color-mix(in srgb, var(--acc) 4%, transparent) 58%, transparent);
    box-shadow:inset 0 1px 0 color-mix(in srgb, var(--acc) 10%, transparent),
               inset 0 -1px 0 color-mix(in srgb, var(--acc) 10%, transparent);
  }
  .nav-item.active .ic{
    color:var(--acc);
    filter:drop-shadow(0 0 6px color-mix(in srgb, var(--acc) 65%, transparent));
  }
  .nav-item.active .cnt{color:color-mix(in srgb, var(--acc) 78%, #fff 0%)}
  .nav-item.active::before{
    content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:3px;height:21px;border-radius:0 3px 3px 0;
    background:linear-gradient(180deg, var(--acc), color-mix(in srgb, var(--acc) 45%, #2A6CFF));
    box-shadow:0 0 14px color-mix(in srgb, var(--acc) 85%, transparent),
               0 0 4px var(--acc);
  }

  .rail-spacer{flex:1;min-height:16px}

  .rail-card{
    border-radius:11px;
    border:1px solid var(--line);
    background:linear-gradient(160deg, rgba(255,255,255,.038), rgba(255,255,255,.012));
    padding:12px 12px 11px;
  }
  .rc-head{
    display:flex;align-items:center;justify-content:space-between;
    font-size:8px;font-weight:600;letter-spacing:.2em;color:var(--faint);
  }
  .live{display:flex;align-items:center;gap:5px;color:#7BE8C2;letter-spacing:.12em}
  .live::before{
    content:"";width:5px;height:5px;border-radius:50%;background:var(--green);
    box-shadow:0 0 7px rgba(91,240,176,.9);
  }
  .rc-name{margin-top:8px;font-size:12.5px;font-weight:600;letter-spacing:.01em}
  .rc-name span{color:var(--faint);font-weight:400}
  .rc-bar{margin-top:9px;height:3px;border-radius:2px;background:rgba(255,255,255,.075);overflow:hidden}
  .rc-bar i{
    display:block;height:100%;width:29%;border-radius:2px;
    background:linear-gradient(90deg,#3AB8FF,#6FF3FF);
    box-shadow:0 0 8px rgba(92,225,255,.6);
  }
  .rc-foot{
    margin-top:8px;display:flex;align-items:center;justify-content:space-between;
    font-size:9px;color:var(--muted);
  }
  .rc-foot b{color:#DCE7F5;font-weight:600;font-family:var(--mono);font-size:9.5px}
  .rc-foot .mono{font-size:8.5px;color:#596272}

  .rail-foot{
    margin-top:14px;padding:0 4px;
    display:flex;align-items:center;justify-content:space-between;
    font-size:8px;letter-spacing:.12em;color:#454E5C;
  }
  .rail-foot .mono{font-size:8px;letter-spacing:0;color:#4A5361}

  /* ---------------------------- main ---------------------------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}

  .head{
    height:92px;flex:0 0 92px;
    padding:20px 26px 0;
    display:flex;align-items:flex-start;justify-content:space-between;
  }
  .crumb{
    display:flex;align-items:center;gap:7px;
    font-size:8.5px;font-weight:600;letter-spacing:.19em;color:var(--faint);
    margin-bottom:7px;
  }
  .crumb .sep{color:#39414E}
  .crumb .cur{color:#7C8798}
  h1{
    font-size:22px;line-height:1.1;font-weight:600;letter-spacing:-.015em;
    display:flex;align-items:baseline;gap:9px;
  }
  h1 .count{
    font-family:var(--mono);font-size:9px;font-weight:400;letter-spacing:0;
    color:#6E7A8C;padding:3px 6px;border-radius:4px;
    background:rgba(255,255,255,.045);border:1px solid var(--line);
    transform:translateY(-1px);
  }
  .sub{margin-top:6px;font-size:11px;color:var(--muted);letter-spacing:.005em}

  .head-right{display:flex;align-items:center;gap:9px;padding-top:2px}
  .search{
    width:288px;height:38px;border-radius:9px;
    display:flex;align-items:center;gap:9px;padding:0 10px 0 11px;
    background:rgba(0,0,0,.34);
    border:1px solid var(--line-2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.025), inset 0 0 22px rgba(0,0,0,.35);
    color:var(--muted);
    transition:border-color .16s ease, box-shadow .16s ease;
  }
  .search:focus-within{
    border-color:rgba(92,225,255,.42);
    box-shadow:0 0 0 3px rgba(92,225,255,.07), inset 0 0 22px rgba(0,0,0,.35);
  }
  .search input{
    flex:1;min-width:0;background:none;border:0;outline:0;
    color:var(--text);font-family:var(--sans);font-size:11.5px;letter-spacing:.005em;
  }
  .search input::placeholder{color:#5E6878}
  .search .kbd{
    font-family:var(--mono);font-size:8.5px;color:#6C7788;
    padding:2px 5px;border-radius:4px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    letter-spacing:.02em;
  }
  .icon-btn{
    width:38px;height:38px;border-radius:9px;display:grid;place-items:center;
    border:1px solid var(--line-2);background:rgba(255,255,255,.022);
    color:#8B96A8;transition:.16s ease;
  }
  .icon-btn:hover{color:#D8E2F0;border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.05)}

  .tools{
    height:46px;flex:0 0 46px;
    padding:0 26px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .seg{
    display:flex;align-items:center;height:30px;padding:3px;gap:2px;
    border-radius:8px;background:rgba(0,0,0,.26);
    border:1px solid rgba(255,255,255,.045);
  }
  .tab{
    height:22px;padding:0 11px;border-radius:6px;
    display:flex;align-items:center;gap:6px;
    font-size:10px;font-weight:600;letter-spacing:.07em;color:#788395;
    transition:.14s ease;
  }
  .tab b{font-family:var(--mono);font-size:8.5px;font-weight:400;color:#5F6A7B}
  .tab:hover{color:#C6D0DE}
  .tab.active{
    color:#A9EEFF;background:rgba(92,225,255,.10);
    box-shadow:inset 0 0 0 1px rgba(92,225,255,.16);
  }
  .tab.active b{color:#66D8F4}

  .tools-right{display:flex;align-items:center;gap:16px}
  .sort{
    display:flex;align-items:center;gap:6px;
    font-size:8.5px;font-weight:600;letter-spacing:.16em;color:var(--faint);
  }
  .sort b{
    font-family:var(--mono);font-size:9.5px;font-weight:400;letter-spacing:0;
    color:#9EAABB;
  }
  .items{font-family:var(--mono);font-size:8.5px;color:#576170;letter-spacing:.04em}

  /* ---------------------------- list ---------------------------- */
  .list-wrap{flex:1;min-height:0;position:relative}
  .list{
    height:100%;position:relative;
    padding:10px 18px 6px 26px;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.16) transparent;
    scrollbar-gutter:stable;
  }
  .list-inner{display:flex;flex-direction:column;gap:7px}
  .list-fade{
    position:absolute;left:0;right:0;bottom:0;height:46px;
    background:linear-gradient(180deg, transparent, rgba(8,11,17,.88));
    pointer-events:none;
  }
  .empty{padding:46px 0;text-align:center;color:var(--faint);font-size:11.5px}

  .module{
    border-radius:10px;
    border:1px solid rgba(255,255,255,.05);
    background:linear-gradient(180deg, rgba(255,255,255,.032), rgba(255,255,255,.012));
    transition:border-color .16s ease, background .16s ease;
    flex:0 0 auto;
  }
  .module:hover{border-color:rgba(255,255,255,.10);background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.016))}
  .module.on.open{
    border-color:rgba(92,225,255,.18);
    background:linear-gradient(180deg, rgba(92,225,255,.045), rgba(255,255,255,.012) 52%);
  }

  .row{
    height:54px;display:flex;align-items:center;gap:12px;
    padding:0 14px 0 16px;cursor:pointer;
  }

  .dot{
    width:18px;height:18px;flex:0 0 18px;border-radius:50%;
    position:relative;display:grid;place-items:center;
    border:1px solid rgba(255,255,255,.16);
    transition:.18s ease;
  }
  .dot::after{
    content:"";width:7px;height:7px;border-radius:50%;
    background:rgba(255,255,255,.16);
    transition:.18s ease;
  }
  .dot:hover{border-color:rgba(255,255,255,.32)}
  .module.on .dot{
    border-color:rgba(92,225,255,.55);
    background:rgba(92,225,255,.08);
    box-shadow:0 0 0 3px rgba(92,225,255,.05), 0 0 12px rgba(92,225,255,.28);
  }
  .module.on .dot::after{
    width:8px;height:8px;background:var(--cyan);
    box-shadow:0 0 8px rgba(92,225,255,.95), 0 0 18px rgba(92,225,255,.5);
  }

  .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .name{
    font-size:13px;font-weight:500;letter-spacing:.005em;color:#AFB9C9;
    transition:color .16s ease;display:flex;align-items:center;gap:7px;
  }
  .module.on .name{color:#F1F6FE}
  .name .badge{
    font-family:var(--mono);font-size:7.5px;font-weight:400;letter-spacing:.1em;
    color:#6BB7C9;background:rgba(92,225,255,.08);
    border:1px solid rgba(92,225,255,.16);border-radius:3px;
    padding:1px 4px;transform:translateY(-.5px);
  }
  .meta{
    display:flex;align-items:center;gap:7px;flex-wrap:nowrap;overflow:hidden;
    font-size:8px;font-weight:500;letter-spacing:.13em;color:#596475;
    white-space:nowrap;
  }
  .module.on .meta{color:#6E7C8E}
  .meta .sep{color:#39414E;letter-spacing:0}
  .meta .mv{
    font-family:var(--mono);font-size:8.5px;letter-spacing:0;
    color:#9FB3C4;text-transform:none;
  }
  .module.on .meta .mv{color:#A8C4D4}

  .key{
    flex:0 0 auto;min-width:21px;height:19px;padding:0 5px;
    display:grid;place-items:center;border-radius:4px;
    font-family:var(--mono);font-size:9px;color:#9FAABB;letter-spacing:.02em;
    background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.028));
    border:1px solid rgba(255,255,255,.085);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 1px 0 rgba(0,0,0,.3);
  }
  .key.none{
    color:#4B5461;background:transparent;border-color:transparent;box-shadow:none;
    font-size:10px;opacity:.8;
  }

  .chev{
    width:20px;height:20px;flex:0 0 20px;display:grid;place-items:center;
    color:#5F6A7A;border-radius:5px;transition:color .16s ease, transform .2s ease;
  }
  .row:hover .chev{color:#A8B5C6}
  .module.open .chev{transform:rotate(180deg);color:#8FD9EA}

  /* ---------------------------- settings ---------------------------- */
  .settings{
    padding:0 14px 14px 46px;
    display:none;
  }
  .module.open .settings{display:block;animation:unfold .18s ease both}
  @keyframes unfold{from{transform:translateY(-3px)}to{transform:none}}

  .settings-in{
    position:relative;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.045);
    background:rgba(3,6,10,.42);
    padding:12px 14px;
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px 22px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
  }
  .ctl.span2{grid-column:span 2}
  .settings-in::before{
    content:"";position:absolute;left:-27px;top:2px;bottom:2px;width:1px;
    background:linear-gradient(180deg, rgba(92,225,255,.35), rgba(92,225,255,.04));
  }

  .ctl{display:flex;flex-direction:column;gap:8px;min-width:0}
  .ctl-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .ctl-label{
    font-size:8px;font-weight:600;letter-spacing:.18em;color:#616C7D;
    white-space:nowrap;
  }
  .ctl-val{
    font-family:var(--mono);font-size:9px;color:#A8DCEB;letter-spacing:0;
    white-space:nowrap;
  }
  .ctl-val.dim{color:#8B97A9}

  .track{
    position:relative;height:14px;display:flex;align-items:center;cursor:pointer;
  }
  .track::before{
    content:"";position:absolute;left:0;right:0;height:3px;border-radius:2px;
    background:rgba(255,255,255,.075);
  }
  .fill{
    position:absolute;left:0;height:3px;border-radius:2px;
    background:linear-gradient(90deg,#2EA7F5,#6FF3FF);
    box-shadow:0 0 10px rgba(92,225,255,.45);
  }
  .thumb{
    position:absolute;width:10px;height:10px;border-radius:50%;
    transform:translateX(-5px);
    background:#EAFBFF;
    box-shadow:0 0 0 2px rgba(92,225,255,.22), 0 0 12px rgba(92,225,255,.55);
    pointer-events:none;
  }
  .ticks{position:absolute;left:0;right:0;bottom:-1px;display:flex;justify-content:space-between;pointer-events:none}
  .ticks i{width:1px;height:3px;background:rgba(255,255,255,.08)}

  .field{
    height:28px;border-radius:6px;padding:0 9px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:rgba(0,0,0,.32);
    border:1px solid rgba(255,255,255,.07);
    font-size:10.5px;color:#D3DCE9;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
    cursor:pointer;transition:border-color .14s ease;
  }
  .field:hover{border-color:rgba(255,255,255,.14)}
  .field .mono{font-size:9.5px;color:#B6C3D4}
  .field .hint{
    font-size:7.5px;font-weight:600;letter-spacing:.14em;color:#596475;
  }
  .field .cv{transition:transform .16s ease;color:#677386}

  .checks{display:flex;flex-direction:column;gap:7px;padding-top:1px}
  .checks.row{flex-direction:row;align-items:center;gap:18px;padding-top:2px;flex-wrap:wrap}
  .check{display:flex;align-items:center;gap:8px;font-size:10.5px;color:#AEB9C9;cursor:pointer}
  .box{
    width:13px;height:13px;flex:0 0 13px;border-radius:4px;
    border:1px solid rgba(255,255,255,.16);

});

function metaHtml(parts){
  return parts.map((p, i) => {
    const pre = i === 0 ? '' : '<span class="sep">·</span>';
    const val = p[1] ? ` <span class="mv">${p[1]}</span>` : '';
    return pre + `<span>${p[0]}</span>` + val;
  }).join('');
}

function sliderHtml(s, id, idx){
  const pct = ((s.val - s.min) / (s.max - s.min)) * 100;
  return `
    <div class="ctl">
      <div class="ctl-head"><span class="ctl-label">${s.label}</span>
        <span class="ctl-val" data-val="${id}-${idx}">${s.val.toFixed(s.dec)}${s.suffix}</span></div>
      <div class="track" data-slider="${id}" data-idx="${idx}">
        <div class="fill" style="width:${pct}%"></div>
        <div class="thumb" style="left:${pct}%"></div>
        <div class="ticks">${'<i></i>'.repeat(9)}</div>
      </div>
    </div>`;
}
function controlHtml(c, id, idx){
  const span = c.span === 2 ? ' span2' : '';
  if (c.t === 'slider') return sliderHtml(c, id, idx);
  if (c.t === 'select') return `
    <div class="ctl${span}">
      <div class="ctl-head"><span class="ctl-label">${c.label}</span></div>
      <div class="field">${c.val}

      <div class="ctl-head"><span class="ctl-label">${c.label}</span></div>
      <div class="field"><span class="mono">${c.val}</span><span class="hint">REBIND</span></div>
    </div>`;
  if (c.t === 'checks') return `
    <div class="ctl${span}">
      <div class="ctl-head"><span class="ctl-label">${c.label}</span></div>
      <div class="checks ${c.row?'row':''}">
        ${c.items.map(([label, on]) => `
          <div class="check ${on?'on':''}"><span class="box">${icon('check',8)}</span>${label}</div>`).join('')}
      </div>
    </div>`;
  return '';
}

function rowHtml(m){
  const open = state.open.has(m.id) && m.settings;
  const key = m.key ? `<span class="key">${m.key}</span>` : `<span class="key none">—</span>`;
  return `
  <article class="module ${m.on?'on':''} ${open?'open':''}" data-id="${m.id}">
    <div class="row">
      <button class="dot" data-act="toggle" aria-label="Toggle ${m.name}"></button>
      <div class="info">
        <div class="name">${m.name}${m.badge ? `<span class="badge">${m.badge}</span>` : ''}</div>
        <div class="meta">${metaHtml(m.meta)}</div>
      </div>
      ${key}
      <span class="chev" data-act="expand">${icon('chevron',11)}</span>
    </div>
    ${open ? `<div class="settings"><div class="settings-in">
        ${m.settings.map((c,i)=>controlHtml(c, m.id, i)).join('')}
    </div></div>` : ''}
  </article>`;
}

function render(resetScroll){
  const cat = CATS.find(c => c.id === state.cat);
  document.documentElement.style.setProperty('--acc', cat.acc);

  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.cat === cat.id));
  document.getElementById('crumb').innerHTML =
    `<span>MODULES</span><span class="sep">/</span><span class="cur">${cat.name.toUpperCase()}</span>`;
  document.getElementById('title').innerHTML =
    `${cat.name} <span class="count" id="count">${cat.count}</span>`;
  document.getElementById('subtitle').textContent = cat.desc;

  let mods = M[cat.id].slice();
  const allOn = mods.filter(m=>m.on).length, allOff = mods.length - allOn;
  if (state.filter === 'on') mods = mods.filter(m=>m.on);
  if (state.filter === 'off') mods = mods.filter(m=>!m.on);
  if (state.query) mods = mods.filter(m => m.name.toLowerCase().includes(state.query));
  mods.sort((a,b) => state.sort === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));

  document.querySelectorAll('.tab').forEach(t => {
    const n = t.dataset.filter === 'all' ? M[cat.id].length
            : t.dataset.filter === 'on' ? allOn : allOff;
    t.querySelector('b').textContent = n;
  });
  document.getElementById('items').textContent = `${mods.length} ITEM${mods.length===1?'':'S'}`;

  const totalOn = Object.values(M).flat().filter(m => m.on).length;
  document.querySelectorAll('[data-on-count]').forEach(el => el.textContent = totalOn);
  const bar = document.getElementById('rc-bar');
  if (bar) bar.style.width = (totalOn / 42 * 100).toFixed(1) + '%';

  const list = document.getElementById('list');
  const keepScroll = list.scrollTop;
  list.innerHTML = mods.length
    ? mods.map(rowHtml).join('')
    : `<div class="empty">No modules match “${state.query}”</div>`;
  list.scrollTop = resetScroll ? 0 : keepScroll;
}

/* ================================================================
   Interaction
   ================================================================ */
const listEl = document.getElementById('list');

listEl.addEventListener('click', e => {
  const mod = e.target.closest('.module'); if (!mod) return;
  const id = mod.dataset.id;
  const m = M[state.cat].find(x => x.id === id); if (!m) return;

  if (e.target.closest('[data-act="toggle"]')) {
    m.on = !m.on;
    if (m.on) m._pulse = true;
    render();
    return;
  }
  if (e.target.closest('.settings')) return;
  if (m.settings) {
    state.open.has(id) ? state.open.delete(id) : state.open.add(id);
    render();
  }
});

/* right-click a row to expand / collapse, matching the footer hint */
listEl.addEventListener('contextmenu', e => {
  const mod = e.target.closest('.module'); if (!mod) return;
  e.preventDefault();
  const m = M[state.cat].find(x => x.id === mod.dataset.id);
  if (!m || !m.settings) return;
  state.open.has(m.id) ? state.open.delete(m.id) : state.open.add(m.id);
  render();
});

/* sliders: pointer drag */
let drag = null;
function applySlider(el, clientX){
  const id = el.dataset.slider, idx = +el.dataset.idx;
  const m = M[state.cat].find(x => x.id === id); if (!m) return;
  const s = m.settings[idx]; if (!s || s.t !== 'slider') return;
  const r = el.getBoundingClientRect();
  let p = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  let v = s.min + p * (s.max - s.min);
  v = Math.round(v / s.step) * s.step;
  s.val = Math.min(s.max, Math.max(s.min, v));
  p = (s.val - s.min) / (s.max - s.min) * 100;
  el.querySelector('.fill').style.width = p + '%';
  el.querySelector('.thumb').style.left = p + '%';
  const out = document.querySelector(`[data-val="${id}-${idx}"]`);
  if (out) out.textContent = s.val.toFixed(s.dec) + s.suffix;
}
listEl.addEventListener('pointerdown', e => {
  const t = e.target.closest('.track'); if (!t) return;
  drag = t; t.setPointerCapture?.(e.pointerId);
  applySlider(t, e.clientX);
});
window.addEventListener('pointermove', e => { if (drag) applySlider(drag, e.clientX); });
window.addEventListener('pointerup', () => { drag = null; });

/* checkboxes */
listEl.addEventListener('click', e => {
  const c = e.target.closest('.check'); if (!c) return;
  c.classList.toggle('on');
});

/* ================================================================
   Render at requested scale (for 2x / 4x export)
   ================================================================ */
const params = new URLSearchParams(location.search);
const scale = parseFloat(params.get('scale') || '1');
if (scale !== 1) {
  document.documentElement.style.zoom = scale;
  document.documentElement.style.width = 1600 + 'px';
  document.documentElement.style.height = 1000 + 'px';
}
/* deep-link state for design exports: ?cat=render&open=esp,tracers */
if (params.get('cat') && CATS.some(c => c.id === params.get('cat'))) state.cat = params.get('cat');
if (params.get('open')) state.open = new Set(params.get('open').split(',').filter(Boolean));
if (params.get('query')) {
  state.query = params.get('query').trim().toLowerCase();
  document.getElementById('q').value = params.get('query');
}

render();
</script>
</body>
</html>
